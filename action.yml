name: "Label when in branch"
description:
  "A Github action to label issues and PRs that are committed to a certain
  branch."
author: "Aurelien Bompard <aurelien@bompard.org>"

inputs:
  label:
    description: "The label to apply"
    required: true
    default: "deployed"
  branch:
    description: "The branch to check"
    required: true
    default: "deployment"
  token:
    description: "The Github/Forgejo Token"
    required: true
  exclude_bots:
    description: "Do not act on issues and PRs created by bots"
    default: "true"
  server_type:
    description: "Server type ('github' or 'forgejo' / 'gitea'). Defaults to auto-detect."
    required: false
    default: "auto"

branding:
  icon: tag
  color: purple

runs:
  using: "node24"
  main: "dist/index.js"
